# Render Blueprint -- one-click deploy of the dashboard from this GitHub repo.
# On render.com: New + -> Blueprint -> pick this repo -> Apply. Render reads this
# file, builds, and gives you a public https URL. Auto-redeploys on every push.
services:
  - type: web
    name: code-smell-dashboard
    runtime: python
    plan: free
    # Install the dashboard deps (not torch). codebleu goes in with --no-deps because
    # it pins an old tree-sitter; its import is guarded, so a failure here is not fatal.
    # The WordNet download was removed along with METEOR -- nothing needs it now.
    buildCommand: >-
      pip install -r deploy/requirements-space.txt &&
      (pip install --no-deps codebleu || true)
    startCommand: python dashboard/app.py
    envVars:
      - key: HOST            # bind all interfaces so Render can route to it
        value: 0.0.0.0
      - key: ALLOW_EXEC      # correctness check runs submitted code (enabled deliberately;
        value: "1"           # isolated container + timeout. Do not add secret env vars here.
      - key: DASH_NO_BROWSER # it's a server; don't try to open a browser
        value: "1"
      - key: PYTHONSAFEPATH  # keep the working directory off sys.path -- see below
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11.9"
    # PYTHONSAFEPATH is load-bearing here, not hygiene. nltk 3.10 added a guard that
    # refuses to import a module resolved from the current working directory. Render
    # puts the virtualenv *inside* the project directory, so `regex` -- which nltk
    # needs -- looks like it comes from the working directory and is blocked; nltk
    # arrives via rouge_score, which measures.py imports, so the app died at startup.
    # This keeps the guard satisfied. The app adds its own import paths explicitly,
    # so it does not rely on the implicit working-directory entry.
    # Render sets $PORT automatically; the app reads it.
